<template>
    <section class="slider-card">
        <div class="header">
            <label class="slider-label" for="value-slider">{label}</label>
            <output class="value-pill" for="value-slider">{value}</output>
        </div>

        <input
            id="value-slider"
            class="slider"
            type="range"
            min={min}
            max={max}
            step={step}
            value={value}
            oninput={handleInput}
        />

        <div class="range-labels">
            <span>{min}</span>
            <span>{max}</span>
        </div>
    </section>
</template>
