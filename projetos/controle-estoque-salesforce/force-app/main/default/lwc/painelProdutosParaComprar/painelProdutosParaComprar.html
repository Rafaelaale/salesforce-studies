<template>
    <lightning-card title="Produtos para Comprar" icon-name="standard:product">
        <template if:true={erro}>
            <div class="slds-p-horizontal_small slds-text-color_error">{erro}</div>
        </template>
        <template if:true={temProdutos}>
            <lightning-datatable
                key-field="Id"
                data={produtos}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>
        <template if:false={temProdutos}>
            <div class="slds-p-horizontal_small">Nenhum produto abaixo do estoque mínimo.</div>
        </template>
    </lightning-card>
</template>
